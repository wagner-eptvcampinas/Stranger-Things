<!DOCTYPE html>
<html>
<head>
    <title>Stranger Things: A Escolha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <style>
        body { 
            background-color: #e3d1ca; 
            text-align: center; 
            color: #5c4a43; 
            font-family: 'Comic Sans MS', sans-serif; 
            margin: 0;
            padding: 10px;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        
        #container-jogo {
            position: relative;
            width: 360px;
            margin: 0 auto;
        }

        canvas { 
            background-color: #fbf5f2; 
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            max-width: 100%;
            height: auto;
        }

        .painel-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        
        .fundo-menu { background-color: rgba(227, 209, 202, 0.95); }
        .fundo-gameover { background-color: rgba(92, 74, 67, 0.85); color: #fff; }

        /* Grade de seleção de personagens */
        .grade-personagens {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .btn-perso {
            background-color: #fff;
            border: 3px solid #ff9aa2;
            border-radius: 15px;
            padding: 10px 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            color: #5c4a43;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
        }
        .btn-perso:hover { background-color: #ffeff1; }

        /* 🖼️ ESTILO DAS FOTOS NO MENU */
        .btn-perso img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 5px;
            border: 2px solid #ff9aa2;
            background-color: #fff;
        }

        .botao-fofo {
            background-color: #ff9aa2;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #e27d85;
            transition: 0.1s;
            margin-top: 10px;
        }
        .botao-fofo:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #e27d85;
        }

        .texto-destaque { font-size: 20px; margin: 5px 0; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎮 SÓ PEGUE O QUE AMA </h1>
    
    <div id="container-jogo">
        <canvas id="tela" width="360" height="480"></canvas>

        <!-- TELA 1: SELEÇÃO DE PERSONAGEM -->
        <div id="menu-inicial" class="painel-overlay fundo-menu">
            <p class="texto-destaque">Escolha seu personagem:</p>
            
            <div class="grade-personagens">
                <button class="btn-perso" onclick="selecionar('Dustin')"><img src="Dustin.png">Dustin</button>
                <button class="btn-perso" onclick="selecionar('Eleven')"><img src="Eleven.png">Eleven</button>
                <button class="btn-perso" onclick="selecionar('Hopper')"><img src="Hopper.png">Hopper</button>
                <button class="btn-perso" onclick="selecionar('Joyce')"><img src="Joyce.png">Joyce</button>
                <button class="btn-perso" onclick="selecionar('Lucas')"><img src="Lucas.png">Lucas</button>
                <button class="btn-perso" onclick="selecionar('Max')"><img src="Max.png">Max</button>
                <button class="btn-perso" onclick="selecionar('Mike')"><img src="Mike.png">Mike</button>
            </div>
            
            <p>🏆 Melhor Pontuação: <span id="recorde-menu">0</span></p>
        </div>

        <!-- TELA 2: GAME OVER -->
        <div id="menu-fim" class="painel-overlay fundo-gameover" style="display: none;">
            <h1 style="color: #ff9aa2;">Fim de Jogo!</h1>
            <p class="texto-destaque">Você fez <span id="pontos-finais">0</span> pontos!</p>
            <p id="mensagem-recorde" style="color: #b5e2fa;"></p>
            <button class="botao-fofo" onclick="voltarMenu()">NOVO JOGO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("tela");
        const ctx = canvas.getContext("2d");

        // CARREGAR IMAGENS FIXAS
        const imgCenario = new Image(); imgCenario.src = "cenario.png"; 
        const imgDemogorgon = new Image(); imgDemogorgon.src = "Demogorgon.png"; 
        const imgVecna = new Image(); imgVecna.src = "Vecna.png"; 

        const imgJogador = new Image();
        const imgAma = new Image();
        const imgOdeia = new Image();

        let estado = "MENU";
        let recorde = localStorage.getItem("recordeST") || 0;
        document.getElementById("recorde-menu").innerText = recorde;

        let jogador, obstaculo, itemBom, pontos;
        let listaInimigos = [];

        // CONTROLES
        function moverComToque(e) {
            if (estado !== "JOGANDO") return;
            const retanguloCanvas = canvas.getBoundingClientRect();
            let mouseX = (e.touches.clientX - retanguloCanvas.left) * (canvas.width / retanguloCanvas.width);
            jogador.x = mouseX - (jogador.largura / 2);
            travarBordas();
            e.preventDefault();
        }
        canvas.addEventListener("touchstart", moverComToque, { passive: false });
        canvas.addEventListener("touchmove", moverComToque, { passive: false });

        window.addEventListener("mousemove", (e) => {
            if (estado !== "JOGANDO") return;
            const retanguloCanvas = canvas.getBoundingClientRect();
            let mouseX = (e.clientX - retanguloCanvas.left) * (canvas.width / retanguloCanvas.width);
            jogador.x = mouseX - (jogador.largura / 2);
            travarBordas();
        });

        function travarBordas() {
            if (jogador.x < 0) jogador.x = 0;
            if (jogador.x > canvas.width - jogador.largura) jogador.x = canvas.width - jogador.largura;
        }

        // SELEÇÃO DE PERSONAGEM
        function selecionar(nome) {
            imgJogador.src = nome + ".png";
            imgAma.src = nome + "Ama.png";
            imgOdeia.src = nome + "Odeia.png";
            listaInimigos = [imgDemogorgon, imgVecna, imgOdeia];
            iniciarJogo();
        }

        function iniciarJogo() {
            document.getElementById("menu-inicial").style.display = "none";
            document.getElementById("menu-fim").style.display = "none";
            jogador = { x: 150, y: 390, largura: 60, altura: 60 };
            obstaculo = { 
                x: Math.random() * 300, y: -50, tamanho: 55, velocidade: 3,
                imagem: listaInimigos[Math.floor(Math.random() * listaInimigos.length)]
            };
            itemBom = { x: Math.random() * 310, y: -200, tamanho: 45, velocidade: 2.5 };
            pontos = 0;
            estado = "JOGANDO";
            loop();
        }

        function voltarMenu() {
            document.getElementById("menu-fim").style.display = "none";
            document.getElementById("menu-inicial").style.display = "flex";
            estado = "MENU";
        }

        function loop() {
            if (estado !== "JOGANDO") return;
            atualizar();
            desenhar();
            requestAnimationFrame(loop);
        }

        function atualizar() {
            obstaculo.y += obstaculo.velocidade;
            itemBom.y += itemBom.velocidade;

            if (obstaculo.y > canvas.height) {
                obstaculo.y = -50;
                obstaculo.x = Math.random() * (canvas.width - obstaculo.tamanho);
                obstaculo.imagem = listaInimigos[Math.floor(Math.random() * listaInimigos.length)];
                pontos += 1;
                obstaculo.velocidade += 0.1; 
            }

            if (itemBom.y > canvas.height) {
                itemBom.y = -300;
                itemBom.x = Math.random() * (canvas.width - itemBom.tamanho);
            }

            if (jogador.x < obstaculo.x + obstaculo.tamanho &&
                jogador.x + jogador.largura > obstaculo.x &&
                jogador.y < obstaculo.y + obstaculo.tamanho &&
                jogador.y + jogador.altura > obstaculo.y) {
                finalizarJogo();
            }

            if (jogador.x < itemBom.x + itemBom.tamanho &&
                jogador.x + jogador.largura > itemBom.x &&
                jogador.y < itemBom.y + itemBom.tamanho &&
                jogador.y + jogador.altura > itemBom.y) {
                pontos += 5;
                itemBom.y = -300;
                itemBom.x = Math.random() * (canvas.width - itemBom.tamanho);
            }
        }

        function finalizarJogo() {
            estado = "GAMEOVER";
            document.getElementById("pontos-finais").innerText = pontos;
            let novoRecorde = false;
            if (pontos > recorde) {
                recorde = pontos;
                localStorage.setItem("recordeST", recorde);
                document.getElementById("recorde-menu").innerText = recorde;
                novoRecorde = true;
            }
            const msgRec = document.getElementById("mensagem-recorde");
            msgRec.innerHTML = novoRecorde ? "🎉 NOVO RECORDE! 🎉" : "O recorde é: " + recorde;
            document.getElementById("menu-fim").style.display = "flex";
        }

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            try { ctx.drawImage(imgCenario, 0, 0, canvas.width, canvas.height); } catch(e) {}
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(imgJogador, jogador.x, jogador.y, jogador.largura, jogador.altura);
            ctx.drawImage(obstaculo.imagem, obstaculo.x, obstaculo.y, obstaculo.tamanho, obstaculo.tamanho);
            ctx.drawImage(imgAma, itemBom.x, itemBom.y, itemBom.tamanho, itemBom.tamanho);
            ctx.fillStyle = "#ffb7b2";
            ctx.beginPath(); ctx.roundRect(10, 10, 120, 40, 10); ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px 'Comic Sans MS'";
            ctx.fillText("Pontos: " + pontos, 20, 37);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
                this.beginPath(); this.moveTo(x+r, y);
                this.arcTo(x+w, y, x+w, y+h, r); this.arcTo(x+w, y+h, x, y+h, r);
                this.arcTo(x, y+h, x, y, r); this.arcTo(x, y, x+w, y, r);
                this.closePath(); return this;
            }
        }
    </script>
</body>
</html>
